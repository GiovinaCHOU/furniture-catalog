.adjbox{position:relative;overflow:hidden;background:var(--paper);margin:12px auto 0;max-width:100%;cursor:grab;touch-action:none;user-select:none}.adjbox:active{cursor:grabbing}.adjbox img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}

<body>
<div id="app"><div class="center">載入型錄中</div></div>
<dialog id="dlg"></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbw-GcR1WCM4So6xacTMr-gOxJtYHtZQtR29eHjdJ7F6lmmCF1n_9CKlu2TpIPdOEoKrzg/exec';
const LINE='@473dadky';
const LINE_URL='https://lin.ee/taAPQlsD';
const BANK={code:'806 元大銀行｜永和分行',name:'永美室內裝修設計有限公司',acct:'20222000104927'};
const PAY={現金:'請於上班時間至永美門市現金結帳。',匯款:'請將費用匯至以下帳戶，回傳官方 LINE 匯款成功畫面截圖，並提供帳戶末五碼，以利查帳，謝謝～'};
const CATC={餐椅:'#A0613E',餐桌:'#6B4C3B',茶几:'#8C8A5A',邊櫃:'#5E6B5C',沙發:'#B08A5A',燈具:'#C49A45',地毯:'#7A6274'};
const SHIP_NOTE={160:'小件運費',1200:'大型家具運費'};
const lineBtn=(t='加入官方 LINE')=>`<a class="linebtn" href="${LINE_URL}" target="_blank" rel="noopener">${t}</a>`;
const bankBox=()=>`<div class="bank"><div>${esc(BANK.code)}</div><div>${esc(BANK.name)}</div><div class="acct"><b>${esc(BANK.acct)}</b> <button type="button" class="linkbtn" data-copy="${esc(BANK.acct)}">複製帳號</button></div></div>`;
function bindCopy(root){root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='已複製'}catch(e){b.textContent='請長按帳號複製'}})}
const VIEW=new URLSearchParams(location.search).get('view')||'';
const STAFF=VIEW==='staff',ADMIN=VIEW==='admin',PRINT=VIEW==='print';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Math.round(Number(n)).toLocaleString('en-US');
const money=n=>'NT$'+num(n);
const img=(x,w=900)=>{if(!x)return '';x=String(x);if(/^https?:\/\//.test(x))return x;return `https://lh3.googleusercontent.com/d/${encodeURIComponent(x)}=w${w}`};
const safeUrl=u=>/^https?:\/\//.test(String(u))?String(u):'';
const cc=c=>CATC[c]||'#7A6656';
let DATA=null,filter='全部',cart=[],sel=null,pw='';
try{cart=JSON.parse(localStorage.getItem('kb_cart')||'[]')}catch(e){}
const saveCart=()=>{try{localStorage.setItem('kb_cart',JSON.stringify(cart))}catch(e){}};
const dlg=$('#dlg');

async function get(q){const r=await fetch(API_URL+'?'+q);const j=await r.json();if(j.error)throw new Error(j.error);
 /* 同一系列的款式依售價由低到高排序；同價維持試算表順序 */
 if(Array.isArray(j.series))j.series.forEach(s=>s.items.sort((x,y)=>x.price-y.price));return j}
async function post(b){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});const j=await r.json();if(j.error)throw new Error(j.error);return j}
const shownPrice=i=>STAFF?i.staff:i.price;
const skuMap=()=>Object.fromEntries(DATA.series.flatMap(s=>s.items.map(i=>[i.sku,{...i,series:s}])));
const preOf=s=>{const p=[...new Set(s.items.map(i=>i.pre).filter(Boolean))];return p.length===1?p[0]:p.length?'依款式而定':''};
const coverOf=s=>s.cover||(s.items.find(i=>i.img)||{}).img||'';
/* 照片順序：後台拖曳排序的結果優先，新上傳但還沒排序的照片接在後面 */
function ordered(s,gal){const base=[...new Set([...(gal||[]),...s.items.map(i=>i.img)].filter(Boolean))];const o=(s.order||(s.cover?[s.cover]:[])).filter(x=>!gal||base.includes(x));return [...o,...base.filter(x=>!o.includes(x))]}

/* 運費：同一張訂單取最高級距；樓層費無電梯 2 樓起每層 +200 */
const RULE_TEXT={order:'每張訂單計一次',large:'僅含大型家具的訂單收取',item:'大型家具依件數計算'};
function fees(lines,floor,elevator,rule=DATA&&DATA.floorRule||'item',per=DATA&&DATA.perFloor||250){
 const ship=lines.length?Math.max(...lines.map(l=>l.ship||1200)):0;
 const q=lines.filter(l=>(l.ship||1200)>=1200).reduce((a,l)=>a+l.qty,0);
 const f=Math.floor(Number(floor))||0;let ff=0;
 if(elevator==='無'&&f>=2){const p=(f-1)*per;ff=rule==='item'?p*q:rule==='large'?(ship>=1200?p:0):p}
 return {ship,floorFee:ff};
}

<div><h3>樓層費</h3><ul><li>大型家具無電梯 2 樓起，每層加收 NT$${num(DATA.perFloor||250)}（${RULE_TEXT[r]}）</li><li>有電梯不另收</li><li>小件以新竹物流寄送，送達一樓或管理室，無法搬運上樓</li></ul></div>`}

</div></section>`}

function specList(s,it){
 const l=[];if(s.mat)l.push(['材質',s.mat]);if(s.size)l.push(['尺寸',s.size]);
 s.other.forEach(o=>{const m=o.match(/^(.{1,6})[:：]\s*(.+)$/);l.push(m?[m[1],m[2]]:['',o])});
 if(it&&it.pre)l.push(['預購',it.pre]);else{const p=preOf(s);if(p)l.push(['預購',p])}
 return l;
}
/* 商品照片輪播：每 2 秒自動換下一張，打開時從首圖開始；手動切換後暫停 8 秒，左右鍵、箭頭、滑動、點縮圖都能切換 */
let CAR=null;
function stopCarousel(){if(CAR){clearInterval(CAR.t);clearTimeout(CAR.r);document.removeEventListener('keydown',CAR.key);CAR=null}}
function startCarousel(list,main){
 stopCarousel();
 const v=$('.viewer',dlg);if(!v)return;
 const pic=$('.main',v),cnt=$('.count',v),tb=$('.thumbs',dlg);
 let i=Math.max(0,list.indexOf(main));
 const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 const show=k=>{if(!pic.isConnected){stopCarousel();return}if(!list.length)return;i=(k+list.length)%list.length;sel.photo=list[i];
  pic.classList.add('fade');setTimeout(()=>{pic.src=img(list[i],1200);pic.classList.remove('fade')},120);
  if(cnt)cnt.textContent=`${i+1} / ${list.length}`;pre(i+1);
  if(tb){tb.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-current',b.dataset.t===list[i]));const cur=tb.querySelector('[aria-current="true"]');if(cur)tb.scrollTo({left:cur.offsetLeft-tb.clientWidth/2+cur.clientWidth/2,behavior:'smooth'})}};
 const play=()=>{if(reduce||list.length<2||!CAR)return;clearInterval(CAR.t);CAR.t=setInterval(()=>show(i+1),2000)};
 const pre=k=>{const u=list[(k+list.length)%list.length];if(u){const im=new Image();im.referrerPolicy='no-referrer';im.src=img(u,1200)}};
 pre(i+1);
 const pause=()=>{if(CAR)clearInterval(CAR.t)};
 const manual=k=>{show(k);pause();clearTimeout(CAR.r);CAR.r=setTimeout(play,8000)};
 CAR={t:0,r:0,key:e=>{if(!dlg.open||!$('.viewer',dlg))return;if(e.key==='ArrowLeft')manual(i-1);else if(e.key==='ArrowRight')manual(i+1)}};
 document.addEventListener('keydown',CAR.key);
 const pv=$('.prev',v),nx=$('.next',v);if(pv)pv.onclick=()=>manual(i-1);if(nx)nx.onclick=()=>manual(i+1);
 dlg.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>manual(list.indexOf(b.dataset.t)));
 let x0=null;
 v.addEventListener('pointerdown',e=>{if(e.target.closest('.nav'))return;x0=e.clientX});
 v.addEventListener('pointerup',e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>40)manual(dx<0?i+1:i-1)});
 play();
}
dlg.addEventListener('close',stopCarousel);

 const main=sel.photo||it.img||(sel.gallery||[])[0]||coverOf(s);

 ${thumbs.length>1?`<div class="thumbs">${thumbs.map(t=>`<button data-t="${esc(t)}" aria-current="${t===main}" aria-label="查看其他照片"><img loading="lazy" referrerpolicy="no-referrer" src="${img(t,160)}" alt=""></button>`).join('')}</div>`:''}</div>

 ${s.items.length>1?`<fieldset><legend>款式</legend><div class="opts">${s.items.map(i=>`<button class="opt" aria-pressed="${i.sku===sel.sku}" data-sku="${esc(i.sku)}">${esc(i.label||i.sku)}</button>`).join('')}</div></fieldset>`:''}
 <div class="bigprice">${money(shownPrice(it))}${STAFF?'<span class="pricetag">員工價</span>':''}</div>${STAFF?`<div class="sub">原價 <s>${money(it.price)}</s>｜${SHIP_NOTE[it.ship]||'運費'} NT$${num(it.ship)}</div>`:''}

 ${s.intro?`<p class="intro">${esc(s.intro)}</p>`:''}
 ${s.feat.length?`<ul class="feat">${s.feat.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
 <ul class="spec">${specList(s,it).map(([k,v])=>`<li>${k?`<b>${esc(k)}</b>　`:''}${esc(v)}</li>`).join('')}</ul></div></div>`;
 dlg.querySelector('[data-close]').onclick=()=>dlg.close();
 dlg.querySelectorAll('[data-sku]').forEach(b=>b.onclick=()=>{sel.sku=b.dataset.sku;sel.photo=null;renderDetail()});
 startCarousel(thumbs,main);
 dlg.querySelectorAll('img').forEach(i=>i.onerror=()=>{i.style.visibility='hidden'});
 const add=$('#add',dlg);if(add)add.onclick=()=>{
  const q=Math.floor(Number($('#qty',dlg).value));if(!(q>=1&&q<=99)){$('#qty',dlg).focus();return}
  const ex=cart.find(c=>c.sku===it.sku);if(ex)ex.qty=Math.min(99,ex.qty+q);else cart.push({sku:it.sku,qty:q});
  saveCart();dlg.close();renderShop();
 };
}

 const cs=data.series.find(s=>s.cat==='沙發')||data.series[0];
 const coverImg=C.img||coverOf(cs);
 const cover=`<section class="sheet cover" data-key="COVER">${EDIT?`<button class="resetpage" data-reset-page="COVER">還原此頁</button>`:''}${slot('COVER.img','',coverImg,2000,'cv-img')}
  <div class="cv-panel"><div><small>YUNGMEI LIVING 永美家居</small><h1 data-edit="COVER.title">${esc(C.title||'家具型錄')}</h1><p data-edit="COVER.sub">${esc(C.sub||'2026｜'+cats.join('・'))}</p>${showStaff?'<p style="color:var(--soft);font-size:9.5pt;margin-top:2mm">員工價版本</p>':''}</div>${qrBlock}</div></section>`;
 const toc=`<section class="sheet toc" data-key="TOC">${catTabs(cats)}<div class="sh-top"><b>YUNGMEI LIVING 永美家居</b><span>家具型錄</span></div><div class="sh-title"><h2>目錄</h2><span>右側色標對應分類</span></div>
  ${cats.map(c=>{const list=data.series.filter(s=>s.cat===c);return `<div class="ci"><i style="background:${cc(c)}"></i><h3>${esc(c)}</h3>${PD.showPN?`<em style="margin-left:auto">P.${first[c]}</em>`:''}</div>`}).join('')}
  <div class="sh-info" style="margin-top:6mm"><div data-edit="TOC.html" data-html="1">${CFG.TOC&&CFG.TOC.html?cleanHtml(CFG.TOC.html):`<h3>關於預購</h3><p>本型錄商品皆為預購，到貨天數依各頁標示。實木與天然石材的紋理、色澤各有不同，屬正常現象。</p>`}</div></div>
  <div style="flex:1"></div><div class="sh-foot"><span>商品資訊僅供參考，實際以商品標示為準</span><span>${PD.showPN?2:''}</span></div></section>`;
 const rule=data.floorRule||'item';
 const info=`<section class="sheet" data-key="INFO">${EDIT?`<button class="resetpage" data-reset-page="INFO">還原此頁</button>`:''}<div class="sh-top"><b>YUNGMEI LIVING 永美家居</b><span>家具型錄</span></div><div class="sh-info"><div data-edit="INFO.html" data-html="1">${CFG.INFO&&CFG.INFO.html?cleanHtml(CFG.INFO.html):`<div class="sh-title"><h2>訂購須知</h2></div>
  <h3>運費</h3><table class="ptab"><tr><th>級距</th><th>適用品項</th><th class="n">運費</th></tr><tr><td>小件</td><td>餐椅、燈飾、6,000 元以下餐桌等</td><td class="n">NT$160</td></tr><tr><td>大型家具</td><td>沙發、地毯、餐桌、邊櫃、茶几等</td><td class="n">NT$1,200</td></tr></table>
  <p style="margin-top:2mm">同一張訂單只收一次運費，有大型家具時以 NT$1,200 計。</p>
  <h3>樓層費</h3><p>大型家具無電梯 2 樓起，每層加收 NT$${num(data.perFloor||250)}（${RULE_TEXT[rule]}），有電梯不另收。</p><p>小件以新竹物流寄送，送達一樓或管理室，無法搬運上樓。</p>
  ${showStaff?'<h3>員工價</h3><p>員工價為售價 8 折，運費與樓層費不適用員工折扣。</p>':''}
  <h3>預購與到貨</h3><p>商品皆為預購，到貨天數依各商品標示。實木與天然石材的紋理、色澤各有不同，屬正常現象；商品顏色以實品為準。</p>`}</div>
  <h3>訂購與詢問</h3><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8mm"><p>官方 LINE ${LINE}<br>永美室內裝修設計有限公司<br>新北市永和區自由街55號1樓<br>(02) 2923-0218</p>${qrBlock}</div></div><div style="flex:1"></div><div class="sh-foot"><span></span><span>${PD.showPN?p:''}</span></div></section>`;
 const total=p;
 $('#app').innerHTML=`<div class="ptool"><b>型錄輸出</b><span class="sub" id="pst">共 ${total} 頁，圖片載入中</span>
  ${EDIT?`<span class="sub">點文字直接修改，點圖片換圖</span><input type="password" id="ppw" placeholder="後台密碼" value="${esc(pw)}" style="padding:6px;border:1px solid var(--line);width:120px"><button class="primary" id="psave">儲存修改${DIRTY.size?`（${DIRTY.size}）`:''}</button><button class="ghost" id="pdone">完成編輯</button>`
  :`<button class="ghost" id="pedit">編輯內容與圖片</button><label><input type="checkbox" id="pstaff" ${showStaff?'checked':''}> 顯示員工價</label><label><input type="checkbox" id="ppn" ${PD.showPN?'checked':''}> 顯示頁碼</label><label>分類 <select id="pcat"><option value="">全部</option>${cats.map(c=>`<option ${PD.only===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><button class="primary" id="pp">列印 / 存成 PDF</button>`}
  <a href="?view=admin">回後台</a><span class="err" id="perr" hidden></span></div>
  <div class="sheets${EDIT?' editing':''}">${PD.only?'':cover+toc}${PD.only?pages.filter((x,k)=>data.series[k].cat===PD.only).join(''):pages.join('')}${PD.only?'':info}</div>`;
 fitAll();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
 fitSheets();
 const imgs=[...document.querySelectorAll('.sheet img')];let done=0;imgs.forEach(i=>i.addEventListener('error',()=>{i.style.visibility='hidden'}));const tick=()=>{done++;if(done>=imgs.length)$('#pst').textContent=`共 ${document.querySelectorAll('.sheet').length} 頁，${EDIT?'編輯中':'可以列印了'}`};
 imgs.forEach(i=>{if(i.complete)tick();else{i.addEventListener('load',tick);i.addEventListener('error',tick)}});if(!imgs.length)tick();
 if(!EDIT){
  const goPrint=()=>{location.search='?view=print'+($('#pstaff').checked?'&staff=1':'')+($('#ppn').checked?'&pn=1':'')};
  $('#pstaff').onchange=goPrint;$('#ppn').onchange=goPrint;
  $('#pcat').onchange=e=>{PD.only=e.target.value;drawPrint()};
  $('#pp').onclick=()=>window.print();
  $('#pedit').onclick=()=>{EDIT=true;drawPrint()};
  return;
 }
 document.querySelectorAll('[data-edit]').forEach(el=>{
  el.contentEditable='true';el.spellcheck=false;
  el.addEventListener('input',()=>{clearTimeout(el.__ft);el.__ft=setTimeout(()=>fitPage(el.closest('.sheet')),400)});
  el.addEventListener('input',()=>{const [k,f]=el.dataset.edit.split('.');cfg(k)[f]=el.dataset.html?cleanHtml(el.innerHTML):el.innerText.trim();DIRTY.add(k);$('#psave').textContent=`儲存修改（${DIRTY.size}）`});
 });
 document.querySelectorAll('[data-img]').forEach(el=>el.onclick=()=>openPicker(el.dataset.img,el.dataset.series));
 document.querySelectorAll('[data-adj]').forEach(b=>b.onclick=e=>{e.stopPropagation();openAdjust(b.dataset.adj,b.parentElement)});
 document.querySelectorAll('[data-reset-page]').forEach(b=>b.onclick=()=>{const k=b.dataset.resetPage;CFG[k]=null;DIRTY.add(k);drawPrint()});
 document.querySelectorAll('[data-layout]').forEach(sl=>sl.onchange=()=>{const k=sl.dataset.layout,v=+sl.value;if(v===3)delete cfg(k).layout;else cfg(k).layout=v;DIRTY.add(k);drawPrint()});
 $('#pdone').onclick=()=>{if(DIRTY.size&&!$('#perr').dataset.warned){$('#perr').textContent='還有未儲存的修改，再按一次「完成編輯」會放棄修改';$('#perr').hidden=false;$('#perr').dataset.warned='1';return}EDIT=false;DIRTY.clear();renderPrint()};
 $('#psave').onclick=async()=>{
  pw=$('#ppw').value;const er=$('#perr');er.hidden=true;
  if(!DIRTY.size){er.textContent='沒有需要儲存的修改';er.hidden=false;return}
  const items=[...DIRTY].map(k=>({key:k,value:CFG[k]?JSON.stringify(CFG[k]):''}));
  $('#psave').disabled=true;$('#psave').textContent='儲存中';
  try{await post({action:'admin_print',password:pw,items});DIRTY.clear();$('#psave').textContent='已儲存';$('#psave').disabled=false}
  catch(x){er.textContent=x.message;er.hidden=false;$('#psave').disabled=false;$('#psave').textContent=`儲存修改（${DIRTY.size}）`}
 };
}
/* 自動排版：同一系列維持一頁。內容放不下時，依序微縮照片高度、縮小行距字級，最後才拿掉小圖。 */
const FIT_STEPS=[[112,38,0],[106,36,0],[100,35,0],[94,34,0],[88,32,0],[88,32,1],[82,30,1],[76,28,1],[70,27,1],[64,26,1],[58,24,1],[52,22,1],[64,0,1],[56,0,1],[48,0,1]];
function fitPage(sh){
 if(!sh)return 0;
 const main=sh.querySelector('.sh-main'),th=sh.querySelector('.sh-thumbs'),tb=sh.querySelector('.sh-table'),foot=sh.querySelector('.sh-foot');
 if(!main||!tb)return 0;
 const over=()=>tb.scrollHeight>tb.clientHeight+1||(foot&&foot.offsetTop+foot.offsetHeight>sh.clientHeight-4);
 for(let i=0;i<FIT_STEPS.length;i++){
  const [m,t,tight]=FIT_STEPS[i];
  main.style.height=m+'mm';
  if(th){const f={4:.85,5:.74}[th.dataset.n]||1;th.style.height=t?Math.round(t*f)+'mm':'';th.style.display=t?'':'none'}
  sh.classList.toggle('tight',!!tight);
  if(!over()){sh.dataset.fit=i;return i}
 }
 sh.dataset.fit='over';return -1;
}
function fitAll(){
 const bad=[];
 document.querySelectorAll('.sheet').forEach(s=>{if(fitPage(s)<0)bad.push('「'+(s.querySelector('.sh-title h2')?.textContent||'?')+'」')});
 const st=$('#pst');if(st&&bad.length)st.textContent=`${bad.join('、')} 這幾頁內容太多，請刪減文字`;
}
function fitSheets(){
 const box=document.querySelector('.sheets'),sh=box&&box.querySelector('.sheet');if(!sh)return;
 box.style.zoom='';const w=sh.offsetWidth,avail=document.documentElement.clientWidth-16;
 if(w>avail)box.style.zoom=String(Math.floor(avail/w*1000)/1000);
}
window.addEventListener('resize',()=>{if(PRINT)fitSheets()});
function openPicker(target,series){
 const ids=s=>{const se=PD.data.series.find(x=>x.id===s);return [...new Set([...(PD.gals[s]||[]),...(se?se.items.map(i=>i.img):[])].filter(Boolean))]};
 const isThumb=target.includes('.thumbs.');
 let cur=series||PD.data.series[0].id;
 const draw=()=>{
  dlg.innerHTML=`<div class="cart" style="max-width:820px"><button class="x" aria-label="關閉" data-close>×</button><h2>選擇圖片</h2>
  ${series?'':`<label class="f">系列<select id="pkser">${PD.data.series.map(s=>`<option value="${esc(s.id)}" ${s.id===cur?'selected':''}>${esc(s.id)} ${esc(s.name)}</option>`).join('')}</select></label>`}
  <div class="pick" style="margin-top:12px">${ids(cur).map(p=>`<button data-pk="${esc(p)}" aria-label="選這張"><img loading="lazy" referrerpolicy="no-referrer" src="${img(p,240)}" alt=""></button>`).join('')||'<span class="sub">這個系列找不到照片</span>'}</div>
  <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">${isThumb?'<button class="ghost" data-pk="-">這格不放圖</button>':''}<button class="ghost" data-pk="">改回預設</button></div></div>`;
  dlg.querySelector('[data-close]').onclick=()=>dlg.close();
  const sl=$('#pkser',dlg);if(sl)sl.onchange=()=>{cur=sl.value;draw()};
  dlg.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{setImg(target,b.dataset.pk);dlg.close();drawPrint()});
 };
 draw();if(!dlg.open)dlg.showModal();
}
function openAdjust(key,el){
 const im=el.querySelector('img');if(!im)return;
 const r=el.getBoundingClientRect();const ratio=r.width/r.height;
 const W=Math.min(640,window.innerWidth-80),H=Math.round(W/ratio),BH=Math.min(H,window.innerHeight*0.55),BW=Math.round(BH*ratio);
 let ps={...(posOf(key)||{x:50,y:50,z:1})};
 dlg.innerHTML=`<div class="cart" style="max-width:720px"><button class="x" aria-label="關閉" data-close>×</button><h2>調整位置</h2>
 <p class="sub">拖曳照片移動取景，用滑桿或滑鼠滾輪放大縮小。框內看到的就是印出來的範圍。</p>
 <div class="adjbox" id="ab" style="width:${BW}px;height:${BH}px"><img referrerpolicy="no-referrer" src="${esc(im.src)}" alt=""></div>
 <div class="adjbar"><label for="az">縮放</label><input type="range" id="az" min="1" max="3" step="0.01"><span id="azv" style="width:3.5em"></span></div>
 <div class="adjbar"><button class="ghost" id="ar">重設</button><span style="flex:1"></span><button class="ghost" data-close>取消</button><button class="primary" id="ao">套用</button></div></div>`;
 const box=$('#ab',dlg),pic=$('img',box),z=$('#az',dlg);
 const paint=()=>{pic.style.cssText=posCss(ps);z.value=ps.z;$('#azv',dlg).textContent=ps.z.toFixed(2)+'×'};
 const clamp=v=>Math.max(0,Math.min(100,v));
 let drag=null;
 box.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,px:ps.x,py:ps.y};box.setPointerCapture(e.pointerId)};
 box.onpointermove=e=>{if(!drag)return;
  const nw=pic.naturalWidth||1,nh=pic.naturalHeight||1,cover=Math.max(BW/nw,BH/nh);
  const ox=Math.max(1,nw*cover*ps.z-BW),oy=Math.max(1,nh*cover*ps.z-BH);
  ps.x=clamp(drag.px-(e.clientX-drag.x)/ox*100);ps.y=clamp(drag.py-(e.clientY-drag.y)/oy*100);paint()};
 box.onpointerup=box.onpointercancel=()=>{drag=null};
 box.onwheel=e=>{e.preventDefault();ps.z=Math.max(1,Math.min(3,ps.z*(e.deltaY<0?1.06:1/1.06)));paint()};
 z.oninput=()=>{ps.z=+z.value;paint()};
 $('#ar',dlg).onclick=()=>{ps={x:50,y:50,z:1};paint()};
 $('#ao',dlg).onclick=()=>{const i=key.indexOf('.');const c=cfg(key.slice(0,i));c.pos=c.pos||{};
  const def=ps.x===50&&ps.y===50&&ps.z===1;if(def)delete c.pos[key.slice(i+1)];else c.pos[key.slice(i+1)]={x:Math.round(ps.x*10)/10,y:Math.round(ps.y*10)/10,z:Math.round(ps.z*100)/100};
  DIRTY.add(key.slice(0,i));dlg.close();drawPrint()};
 dlg.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dlg.close());
 paint();if(!dlg.open)dlg.showModal();
}
function setImg(target,val){
 const parts=target.split('.');const c=cfg(parts[0]);
 if(c.pos)delete c.pos[parts.slice(1).join('.')];
 if(parts[1]==='thumbs'){c.thumbs=c.thumbs||[];c.thumbs[+parts[2]]=val===''?null:val}
 else{if(val==='')delete c[parts[1]];else c[parts[1]]=val}
 DIRTY.add(parts[0]);
}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
(async()=>{
 if(PRINT)return renderPrint();
 if(ADMIN)return adminLogin();
 try{DATA=await get(STAFF?'staff=1':'');renderShop()}
 catch(x){$('#app').innerHTML=`<div class="center">型錄暫時無法載入：${esc(x.message)}。請重新整理，或私訊官方 LINE ${LINE}。</div>`}
})();
</script>
